name: pypmis-wave-o1bb1

# Isolated B.1 validation only. Normal and earlier-wave volumes are not mounted.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: o1bb1
      POSTGRES_USER: o1bb1
      POSTGRES_PASSWORD: disposable-o1bb1
    volumes: [o1bb1_postgres:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5544:5432"]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U o1bb1 -d o1bb1]
      interval: 2s
      timeout: 3s
      retries: 30
  migration-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: o1bb1_migration
      POSTGRES_USER: o1bb1
      POSTGRES_PASSWORD: disposable-o1bb1
    volumes: [o1bb1_migration_postgres:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5545:5432"]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U o1bb1 -d o1bb1_migration]
      interval: 2s
      timeout: 3s
      retries: 30
  browser-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: o1bb1_browser
      POSTGRES_USER: o1bb1
      POSTGRES_PASSWORD: disposable-o1bb1
    volumes: [o1bb1_browser_postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U o1bb1 -d o1bb1_browser]
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    image: pypmis-ia-sas-api:latest
    build: {context: ./backend}
    environment:
      DATABASE_URL: postgresql+psycopg://o1bb1:disposable-o1bb1@browser-db:5432/o1bb1_browser
      PYPMIS_TEST_DATABASE_URL: postgresql+psycopg://o1bb1:disposable-o1bb1@db:5432/o1bb1
      PYPMIS_O1BB1_MIGRATION_DATABASE_URL: postgresql+psycopg://o1bb1:disposable-o1bb1@migration-db:5432/o1bb1_migration
      PYPMIS_O1BB1_FIXTURE: disposable-only
      PYTHONDONTWRITEBYTECODE: "1"
      PYPMIS_PYTEST_RUNTIME_DIR: /tmp/o1bb1-pytest
      PYPMIS_PYTEST_BASETEMP: /tmp/o1bb1-tests
      AUTO_CREATE_SCHEMA: "false"
      SEED_DEMO_DATA: "false"
      AUTH_SECRET_KEY: isolated-o1bb1-validation-only
      RATE_LIMIT_ENABLED: "false"
      CORS_ORIGINS: http://127.0.0.1:5514,http://localhost:5514
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      REDIS_URL: redis://redis:6379/0
      DOCUMENT_STORAGE_PATH: /var/lib/o1bb1-documents
    volumes:
      - ./backend:/app:ro
      - ./outputs/.qa/wave-o1bb1-20261021:/artifacts
      - o1bb1_documents:/var/lib/o1bb1-documents
    ports: ["127.0.0.1:8854:8000"]
    command: [python, -m, uvicorn, app.main:app, --host, 0.0.0.0, --port, "8000"]
    depends_on:
      db: {condition: service_healthy}
      migration-db: {condition: service_healthy}
      browser-db: {condition: service_healthy}
      redis: {condition: service_healthy}
  redis:
    image: redis:7-alpine
    command: [redis-server, --save, "", --appendonly, "no"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30
  frontend:
    image: pypmis-ia-sas-frontend:latest
    build: {context: ./frontend}
    environment:
      VITE_API_URL: http://127.0.0.1:8854
      VITE_DEV_PROXY_TARGET: http://api:8000
      VITE_FRONTEND_VALIDATION_MODE: "false"
    volumes:
      - ./frontend:/app:ro
      - /app/node_modules
    ports: ["127.0.0.1:5514:5173"]
    command:
      - /bin/sh
      - -ec
      - |
        node node_modules/vite/bin/vite.js build --outDir /tmp/o1bb1-dist
        npm run preview -- --host 0.0.0.0 --port 5173 --strictPort --outDir /tmp/o1bb1-dist
    depends_on: [api]

volumes:
  o1bb1_postgres:
  o1bb1_migration_postgres:
  o1bb1_browser_postgres:
  o1bb1_documents:
