name: pypmis-wave-o1bc

# Disposable O1B-C validation only. No normal or prior-wave volume is mounted.
services:
  db:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: o1bc, POSTGRES_USER: o1bc, POSTGRES_PASSWORD: disposable-o1bc}
    volumes: [o1bc_postgres:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5546:5432"]
    healthcheck: {test: [CMD-SHELL, pg_isready -U o1bc -d o1bc], interval: 2s, timeout: 3s, retries: 30}
  migration-db:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: o1bc_migration, POSTGRES_USER: o1bc, POSTGRES_PASSWORD: disposable-o1bc}
    volumes: [o1bc_migration_postgres:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5547:5432"]
    healthcheck: {test: [CMD-SHELL, pg_isready -U o1bc -d o1bc_migration], interval: 2s, timeout: 3s, retries: 30}
  browser-db:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: o1bc_browser, POSTGRES_USER: o1bc, POSTGRES_PASSWORD: disposable-o1bc}
    volumes: [o1bc_browser_postgres:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, pg_isready -U o1bc -d o1bc_browser], interval: 2s, timeout: 3s, retries: 30}
  redis:
    image: redis:7-alpine
    command: [redis-server, --save, "", --appendonly, "no"]
    healthcheck: {test: [CMD, redis-cli, ping], interval: 2s, timeout: 3s, retries: 30}
  api:
    image: pypmis-ia-sas-api:latest
    build: {context: ./backend}
    environment:
      DATABASE_URL: postgresql+psycopg://o1bc:disposable-o1bc@browser-db:5432/o1bc_browser
      PYPMIS_TEST_DATABASE_URL: postgresql+psycopg://o1bc:disposable-o1bc@db:5432/o1bc
      PYPMIS_O1BC_MIGRATION_DATABASE_URL: postgresql+psycopg://o1bc:disposable-o1bc@migration-db:5432/o1bc_migration
      PYPMIS_O1BC_FIXTURE: disposable-only
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPYCACHEPREFIX: /tmp/o1bc-python-cache
      PYPMIS_PYTEST_RUNTIME_DIR: /tmp/o1bc-pytest
      PYPMIS_PYTEST_BASETEMP: /tmp/o1bc-tests
      AUTO_CREATE_SCHEMA: "false"
      SEED_DEMO_DATA: "false"
      AUTH_SECRET_KEY: isolated-o1bc-validation-only
      RATE_LIMIT_ENABLED: "false"
      CORS_ORIGINS: http://127.0.0.1:5516,http://localhost:5516
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      REDIS_URL: redis://redis:6379/0
      DOCUMENT_STORAGE_PATH: /var/lib/o1bc-documents
    volumes:
      - ./backend:/app:ro
      - ./outputs/.qa/wave-o1bc-20261022:/artifacts
      - o1bc_documents:/var/lib/o1bc-documents
    ports: ["127.0.0.1:8856:8000"]
    command: [python, -m, uvicorn, app.main:app, --host, 0.0.0.0, --port, "8000"]
    depends_on:
      db: {condition: service_healthy}
      migration-db: {condition: service_healthy}
      browser-db: {condition: service_healthy}
      redis: {condition: service_healthy}
  frontend:
    image: pypmis-ia-sas-frontend:latest
    build: {context: ./frontend}
    environment:
      VITE_API_URL: http://127.0.0.1:8856
      VITE_DEV_PROXY_TARGET: http://api:8000
      VITE_FRONTEND_VALIDATION_MODE: "false"
    volumes: ["./frontend:/app:ro", "/app/node_modules"]
    ports: ["127.0.0.1:5516:5173"]
    command:
      - /bin/sh
      - -ec
      - |
        node node_modules/vite/bin/vite.js build --outDir /tmp/o1bc-dist
        npm run preview -- --host 0.0.0.0 --port 5173 --strictPort --outDir /tmp/o1bc-dist
    depends_on: [api]
volumes:
  o1bc_postgres:
  o1bc_migration_postgres:
  o1bc_browser_postgres:
  o1bc_documents:
