name: pypmis-wave-o2a

# Isolated O2A validation only. No habitual volumes or services.
services:
  db:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: o2a, POSTGRES_USER: o2a, POSTGRES_PASSWORD: disposable-o2a}
    volumes: [o2a_postgres:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5552:5432"]
    healthcheck: {test: [CMD-SHELL, pg_isready -U o2a -d o2a], interval: 2s, timeout: 3s, retries: 30}
  migration-db:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: o2a_migration, POSTGRES_USER: o2a, POSTGRES_PASSWORD: disposable-o2a}
    volumes: [o2a_migration_postgres:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5553:5432"]
    healthcheck: {test: [CMD-SHELL, pg_isready -U o2a -d o2a_migration], interval: 2s, timeout: 3s, retries: 30}
  browser-db:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: o2a_browser, POSTGRES_USER: o2a, POSTGRES_PASSWORD: disposable-o2a}
    volumes: [o2a_browser_postgres:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5554:5432"]
    healthcheck: {test: [CMD-SHELL, pg_isready -U o2a -d o2a_browser], interval: 2s, timeout: 3s, retries: 30}
  redis:
    image: redis:7-alpine
    command: [redis-server, --save, "", --appendonly, "no"]
    healthcheck: {test: [CMD, redis-cli, ping], interval: 2s, timeout: 3s, retries: 30}
  api:
    image: pypmis-ia-sas-api:latest
    build: {context: ./backend}
    environment:
      DATABASE_URL: postgresql+psycopg://o2a:disposable-o2a@browser-db:5432/o2a_browser
      PYPMIS_TEST_DATABASE_URL: postgresql+psycopg://o2a:disposable-o2a@db:5432/o2a
      PYPMIS_O2A_MIGRATION_DATABASE_URL: postgresql+psycopg://o2a:disposable-o2a@migration-db:5432/o2a_migration
      PYPMIS_O2A_FIXTURE: disposable-only
      PYTHONPYCACHEPREFIX: /var/cache/o2a-python
      AUTO_CREATE_SCHEMA: "false"
      SEED_DEMO_DATA: "false"
      AUTH_SECRET_KEY: isolated-o2a-validation-only
      RATE_LIMIT_ENABLED: "false"
      CORS_ORIGINS: http://127.0.0.1:5519,http://localhost:5519
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      REDIS_URL: redis://redis:6379/0
      DOCUMENT_STORAGE_PATH: /var/lib/o2a-documents
    volumes:
      - ./backend:/app:ro
      - ./outputs/.qa/wave-o2a-20261109:/artifacts
      - ./outputs/.qa/wave-o2a-20261109/browser-documents:/var/lib/o2a-documents
      - o2a_python_cache:/var/cache/o2a-python
    ports: ["127.0.0.1:8859:8000"]
    command: [python, -m, uvicorn, app.main:app, --host, 0.0.0.0, --port, "8000"]
    depends_on:
      browser-db: {condition: service_healthy}
      redis: {condition: service_healthy}
  frontend:
    image: pypmis-ia-sas-frontend:latest
    build: {context: ./frontend}
    environment:
      VITE_API_URL: http://127.0.0.1:8859
      VITE_DEV_PROXY_TARGET: http://api:8000
      VITE_FRONTEND_VALIDATION_MODE: "false"
    volumes: ["./frontend:/app:ro", "/app/node_modules"]
    ports: ["127.0.0.1:5519:5173"]
    command:
      - /bin/sh
      - -ec
      - |
        node node_modules/vite/bin/vite.js build --outDir /tmp/o2a-dist
        npm run preview -- --host 0.0.0.0 --port 5173 --strictPort --outDir /tmp/o2a-dist
    depends_on: [api]
volumes:
  o2a_postgres:
  o2a_migration_postgres:
  o2a_browser_postgres:
  o2a_python_cache:
