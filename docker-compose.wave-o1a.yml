name: pypmis-wave-o1a

# Isolated validation only. No production network, volume or project data.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: o1a
      POSTGRES_USER: o1a
      POSTGRES_PASSWORD: disposable-o1a
    volumes: [o1a_postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U o1a -d o1a]
      interval: 2s
      timeout: 3s
      retries: 30
  migration-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: o1a_migration
      POSTGRES_USER: o1a
      POSTGRES_PASSWORD: disposable-o1a
    volumes: [o1a_migration_postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U o1a -d o1a_migration]
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    image: pypmis-ia-sas-api:latest
    build: {context: ./backend}
    environment:
      DATABASE_URL: postgresql+psycopg://o1a:disposable-o1a@db:5432/o1a
      PYPMIS_TEST_DATABASE_URL: postgresql+psycopg://o1a:disposable-o1a@db:5432/o1a
      PYPMIS_O1A_MIGRATION_DATABASE_URL: postgresql+psycopg://o1a:disposable-o1a@migration-db:5432/o1a_migration
      PYPMIS_O1A_FIXTURE: disposable-only
      PYTHONDONTWRITEBYTECODE: "1"
      PYPMIS_PYTEST_RUNTIME_DIR: /tmp/o1a-pytest
      PYPMIS_PYTEST_BASETEMP: /tmp/o1a-tests
      AUTO_CREATE_SCHEMA: "false"
      SEED_DEMO_DATA: "false"
      AUTH_SECRET_KEY: isolated-o1a-validation-only
      RATE_LIMIT_ENABLED: "false"
      CORS_ORIGINS: http://127.0.0.1:5511,http://localhost:5511
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      REDIS_URL: redis://redis:6379/0
      DOCUMENT_STORAGE_PATH: /tmp/o1a-documents
    volumes:
      - ./backend:/app:ro
      - ./outputs/.qa/wave-o1a-20261019:/artifacts
    ports: ["127.0.0.1:8851:8000"]
    command: [python, -m, uvicorn, app.main:app, --host, 0.0.0.0, --port, "8000"]
    depends_on:
      db: {condition: service_healthy}
      migration-db: {condition: service_healthy}
      redis: {condition: service_healthy}
  redis:
    image: redis:7-alpine
    command: [redis-server, --save, "", --appendonly, "no"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30
  frontend:
    image: pypmis-ia-sas-frontend:latest
    build: {context: ./frontend}
    environment:
      VITE_API_URL: http://127.0.0.1:8851
      VITE_DEV_PROXY_TARGET: http://api:8000
      VITE_FRONTEND_VALIDATION_MODE: "false"
    volumes:
      - ./frontend:/app:ro
      - /app/node_modules
    ports: ["127.0.0.1:5511:5173"]
    command:
      - /bin/sh
      - -ec
      - |
        node node_modules/vite/bin/vite.js build --outDir /tmp/o1a-dist
        npm run preview -- --host 0.0.0.0 --port 5173 --strictPort --outDir /tmp/o1a-dist
    depends_on: [api]

volumes:
  o1a_postgres:
  o1a_migration_postgres:
