services:
  gate07c-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gate07c
      POSTGRES_USER: gate07c
      POSTGRES_PASSWORD: gate07c
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gate07c -d gate07c"]
      interval: 2s
      timeout: 3s
      retries: 30

  gate07c-test:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://gate07c:gate07c@gate07c-db:5432/gate07c
      PYPMIS_TEST_DATABASE_URL: postgresql+psycopg://gate07c:gate07c@gate07c-db:5432/gate07c
      AUTO_CREATE_SCHEMA: "true"
      SEED_DEMO_DATA: "true"
      AUTH_SECRET_KEY: gate07c-disposable-only
      RATE_LIMIT_ENABLED: "false"
    command:
      - /bin/sh
      - -ec
      - |
        python -c "from sqlalchemy import text; from app.database.session import Base, engine; import app.domain.models, app.modules.enterprise_structure.models, app.modules.project_creation.models, app.modules.project_workspace_initialization.models, app.modules.physical_workspace_creation.models, app.modules.physical_workspace_initialization.models, app.modules.workspace_context.models, app.modules.idea_demand.models, app.modules.project_proposal.models, app.modules.strategic_gate.models; Base.metadata.create_all(engine); connection = engine.connect(); connection.execute(text('DROP TABLE strategic_gate_decisions')); connection.commit(); connection.close()"
        alembic stamp 20260813_0041
        alembic upgrade head
        pytest --no-cov -q tests/test_strategic_gate_gate07c.py tests/test_project_proposal_gate07b.py tests/test_idea_demand_gate07a.py
        alembic downgrade 20260813_0041
        alembic upgrade head
    depends_on:
      gate07c-db:
        condition: service_healthy
