services:
  gate07m-evid-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gate07e
      POSTGRES_USER: gate07e
      POSTGRES_PASSWORD: gate07e
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gate07e -d gate07e"]
      interval: 2s
      timeout: 3s
      retries: 30

  gate07m-evid-test:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://gate07e:gate07e@gate07m-evid-db:5432/gate07e
      PYPMIS_TEST_DATABASE_URL: postgresql+psycopg://gate07e:gate07e@gate07m-evid-db:5432/gate07e
      AUTO_CREATE_SCHEMA: "false"
      SEED_DEMO_DATA: "true"
      AUTH_SECRET_KEY: gate07m-evid-disposable-only
      RATE_LIMIT_ENABLED: "false"
    command:
      - /bin/sh
      - -ec
      - |
        python tests/postgres/prepare_gate07e_migration_baseline.py
        alembic stamp 20260820_0044
        alembic upgrade head
        alembic current | grep 20260902_0058
        python tests/postgres/validate_gate07m_fin_schema.py --expect 20260902_0058
        python -c 'from app.database.seed import seed_demo; from app.database.session import SessionLocal; db=SessionLocal(); seed_demo(db); db.close()'
        pytest --no-cov -q \
          tests/test_investment_evidence_policy_gate07m_evid.py \
          tests/postgres/test_investment_evidence_policy_postgres.py
    depends_on:
      gate07m-evid-db:
        condition: service_healthy
