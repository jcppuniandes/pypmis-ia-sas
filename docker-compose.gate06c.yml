services:
  gate06c-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gate06c
      POSTGRES_USER: gate06c
      POSTGRES_PASSWORD: gate06c
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gate06c -d gate06c"]
      interval: 2s
      timeout: 3s
      retries: 30

  gate06c-test:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://gate06c:gate06c@gate06c-db:5432/gate06c
      PYPMIS_TEST_DATABASE_URL: postgresql+psycopg://gate06c:gate06c@gate06c-db:5432/gate06c
      AUTO_CREATE_SCHEMA: "true"
      SEED_DEMO_DATA: "true"
      AUTH_SECRET_KEY: gate06c-disposable-only
      RATE_LIMIT_ENABLED: "false"
    command:
      - /bin/sh
      - -ec
      - |
        python -c "from sqlalchemy import text; from app.database.session import Base, engine; import app.domain.models, app.modules.enterprise_structure.models, app.modules.project_creation.models, app.modules.project_workspace_initialization.models, app.modules.physical_workspace_creation.models, app.modules.physical_workspace_initialization.models; Base.metadata.create_all(engine); connection = engine.connect(); connection.execute(text('DROP TABLE physical_workspace_initializations')); connection.commit(); connection.close()"
        alembic stamp 20260812_0037
        alembic upgrade head
        pytest --no-cov -q tests/test_physical_workspace_initialization.py
        alembic downgrade 20260812_0037
        alembic upgrade head
    depends_on:
      gate06c-db:
        condition: service_healthy
