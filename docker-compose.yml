services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pypmis
      POSTGRES_USER: pypmis
      POSTGRES_PASSWORD: pypmis
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pypmis -d pypmis"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://pypmis:pypmis@db:5432/pypmis
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:5173
      AUTO_CREATE_SCHEMA: "true"
      SEED_DEMO_DATA: "true"
      AUTH_SECRET_KEY: dev-local-change-before-production
      DEMO_USER_PASSWORD: demo123
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: ./backend
    command: celery -A app.workers.celery_app worker --loglevel=INFO -Q control-core
    environment:
      DATABASE_URL: postgresql+psycopg://pypmis:pypmis@db:5432/pypmis
      REDIS_URL: redis://redis:6379/0
      AUTO_CREATE_SCHEMA: "false"
      SEED_DEMO_DATA: "false"
      AUTH_SECRET_KEY: dev-local-change-before-production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
