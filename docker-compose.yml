services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pypmis
      POSTGRES_USER: pypmis
      POSTGRES_PASSWORD: pypmis
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pypmis -d pypmis"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-local}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      COMMIT_SHA: ${COMMIT_SHA:-dev}
      DATABASE_URL: postgresql+psycopg://pypmis:pypmis@db:5432/pypmis
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:5173
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-*}"
      AUTO_CREATE_SCHEMA: "true"
      SEED_DEMO_DATA: "${SEED_DEMO_DATA:-false}"
      AUTH_SECRET_KEY: dev-local-change-before-production
      DEMO_USER_PASSWORD: "1234"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-plain}
      METRICS_ENABLED: "true"
      MAX_REQUEST_BODY_MB: "100"
      DOCUMENT_STORAGE_PATH: /app/storage/documents
      DOCUMENT_MAX_UPLOAD_MB: "50"
      DOCUMENT_MAX_ZIP_FILES: "200"
      DOCUMENT_MAX_ZIP_UNCOMPRESSED_MB: "250"
      DOCUMENT_SCAN_MODE: ${DOCUMENT_SCAN_MODE:-local}
      DOCUMENT_CLAMAV_HOST: ${DOCUMENT_CLAMAV_HOST:-clamav}
      DOCUMENT_CLAMAV_PORT: ${DOCUMENT_CLAMAV_PORT:-3310}
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_AUTHORIZATION_URL: ${OIDC_AUTHORIZATION_URL:-}
      OIDC_TOKEN_URL: ${OIDC_TOKEN_URL:-}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
      AI_PROVIDER: ${AI_PROVIDER:-disabled}
      AI_MODEL: ${AI_MODEL:-claude-haiku-4-5-20251001}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-512}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-30}
      BIM_GEOMETRY_CONVERTER_COMMAND: ${BIM_GEOMETRY_CONVERTER_COMMAND:-python -m app.services.ifc_geometry_converter --source {source} --output {output}}
      BIM_GEOMETRY_CONVERTER_TIMEOUT_SECONDS: ${BIM_GEOMETRY_CONVERTER_TIMEOUT_SECONDS:-300}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
      GUNICORN_TIMEOUT_SECONDS: ${GUNICORN_TIMEOUT_SECONDS:-180}
      GUNICORN_GRACEFUL_TIMEOUT_SECONDS: ${GUNICORN_GRACEFUL_TIMEOUT_SECONDS:-30}
    ports:
      - "8000:8000"
    volumes:
      - document_storage:/app/storage/documents
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=2).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    command: celery -A app.workers.celery_app worker --loglevel=INFO -Q control-core
    restart: unless-stopped
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-local}
      DATABASE_URL: postgresql+psycopg://pypmis:pypmis@db:5432/pypmis
      REDIS_URL: redis://redis:6379/0
      AUTO_CREATE_SCHEMA: "false"
      SEED_DEMO_DATA: "false"
      AUTH_SECRET_KEY: dev-local-change-before-production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-plain}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: ./backend
    command: celery -A app.workers.celery_app beat --loglevel=INFO
    restart: unless-stopped
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-local}
      DATABASE_URL: postgresql+psycopg://pypmis:pypmis@db:5432/pypmis
      REDIS_URL: redis://redis:6379/0
      AUTO_CREATE_SCHEMA: "false"
      SEED_DEMO_DATA: "false"
      AUTH_SECRET_KEY: dev-local-change-before-production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-plain}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  document_storage:
  frontend_node_modules:
