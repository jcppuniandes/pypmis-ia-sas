services:
  gate06a-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gate06a
      POSTGRES_USER: gate06a
      POSTGRES_PASSWORD: gate06a
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gate06a -d gate06a"]
      interval: 2s
      timeout: 3s
      retries: 30

  gate06a-test:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://gate06a:gate06a@gate06a-db:5432/gate06a
      PYPMIS_TEST_DATABASE_URL: postgresql+psycopg://gate06a:gate06a@gate06a-db:5432/gate06a
      AUTO_CREATE_SCHEMA: "true"
      SEED_DEMO_DATA: "true"
      AUTH_SECRET_KEY: gate06a-disposable-only
      RATE_LIMIT_ENABLED: "false"
    command:
      - /bin/sh
      - -ec
      - |
        python -c "from app.database.session import Base, engine; import app.domain.models, app.modules.enterprise_structure.models, app.modules.project_creation.models, app.modules.project_workspace_initialization.models; Base.metadata.create_all(engine)"
        alembic stamp 20260812_0035
        alembic upgrade head
        pytest --no-cov -q tests/test_physical_workspace_configuration.py
        alembic downgrade 20260812_0035
        alembic upgrade head
    depends_on:
      gate06a-db:
        condition: service_healthy
