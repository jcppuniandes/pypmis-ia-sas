  wave3b-owner-capability-browser:
    name: Wave 3B USER and ADMIN real Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [wave3b-owner-capability-postgres, backend-lint, frontend-lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npx playwright install --with-deps chromium
      - name: Start isolated real API and production frontend
        run: |
          docker compose -p pypmis-wave3b-browser-ci -f docker-compose.wave3b.yml \
            --profile browser up -d --build wave3b-browser-frontend
          timeout 300 bash -c 'until curl --max-time 10 -sf http://127.0.0.1:8815/api/v1/health/ready >/dev/null; do sleep 2; done'
          timeout 300 bash -c 'until curl --max-time 10 -sf http://127.0.0.1:5518 >/dev/null; do sleep 2; done'
      - name: Run full governed Owner Capability USER and ADMIN workflows
        env:
          E2E_BASE_URL: http://127.0.0.1:5518
          E2E_API_URL: http://127.0.0.1:8815
        run: cd frontend && npx playwright test owner-capability.spec.ts --project=chromium --workers=1
      - name: Preserve real Chromium evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave3b-owner-capability-browser-evidence
          path: frontend/test-results/
          if-no-files-found: ignore
      - name: Destroy isolated browser environment
        if: always()
        run: docker compose -p pypmis-wave3b-browser-ci -f docker-compose.wave3b.yml --profile browser down --remove-orphans

  wave2b-risk-basic-data-postgres:
    name: Wave 2B Risk Governance and Basic Data (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Validate Wave 2B architecture and migration boundaries
        run: python scripts/validate_wave2b_release_guardrails.py
      - name: Run reversible migration and governed evidence acceptance
        shell: bash
        run: |
          set -o pipefail
          mkdir -p outputs/.qa/wave2b-risk-basic-data
          docker compose -p pypmis-wave2b-ci -f docker-compose.wave2b.yml up \
