name: Pilot Readiness CI

on:
  pull_request:
  push:
    branches:
      - main
      - "guided-*"
      - "feature/**"
      - "fix/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qra-engine-postgres:
    name: Wave4 QRA calculation and accepted evidence (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Wave4 additive migration and architecture boundaries
        run: python scripts/validate_qra_engine_guardrails.py
      - name: Run QRA engine, audit, Foundation regressions and real 0068 round trip
        shell: bash
        run: |
          set -o pipefail
          mkdir -p outputs/.qa/qra-engine
          chmod 0777 outputs/.qa/qra-engine
          docker compose -p pypmis-qra-engine-ci -f docker-compose.qra-engine.yml up \
            --build --abort-on-container-exit --exit-code-from qra-validation \
            qra-validation 2>&1 | tee outputs/.qa/qra-engine/postgres-validation.log
      - name: Preserve Wave4 PostgreSQL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qra-engine-postgres-validation
          path: |
            outputs/.qa/qra-engine/postgres-validation.log
            outputs/.qa/qra-engine/backend-postgres-final.xml
          if-no-files-found: error
      - name: Destroy isolated Wave4 acceptance environment
        if: always()
        run: docker compose -p pypmis-qra-engine-ci -f docker-compose.qra-engine.yml down --remove-orphans

  qra-engine-browser:
    name: Wave4 QRA USER and ADMIN with real Celery and Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [qra-engine-postgres, backend-lint, frontend-lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npx playwright install --with-deps chromium
      - name: Start isolated migrated API, Celery worker and production frontend
        run: |
          docker compose -p pypmis-qra-engine-browser-ci -f docker-compose.qra-engine.yml \
            --profile browser up -d --build qra-browser-worker qra-browser-frontend
          timeout 300 bash -c 'until curl --max-time 10 -sf http://127.0.0.1:8820/api/v1/health/ready >/dev/null; do sleep 2; done'
          timeout 300 bash -c 'until curl --max-time 10 -sf http://127.0.0.1:5523 >/dev/null; do sleep 2; done'
      - name: Validate governed Wave4 lifecycle with an independent analysis authority
        env:
          E2E_BASE_URL: http://127.0.0.1:5523
          E2E_API_URL: http://127.0.0.1:8820
        run: cd frontend && npx playwright test qra-engine.spec.ts --project=chromium --workers=1
      - name: Preserve Wave4 browser diagnostics
        if: always()
        run: |
          mkdir -p outputs/.qa/qra-engine
          docker compose -p pypmis-qra-engine-browser-ci -f docker-compose.qra-engine.yml \
            --profile browser logs --no-color > outputs/.qa/qra-engine/browser-stack.log
      - name: Preserve Wave4 Chromium evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qra-engine-browser-evidence
          path: |
            frontend/test-results/
            outputs/.qa/qra-engine/browser-stack.log
          if-no-files-found: ignore
      - name: Destroy isolated Wave4 browser environment
        if: always()
        run: docker compose -p pypmis-qra-engine-browser-ci -f docker-compose.qra-engine.yml --profile browser down --remove-orphans

  qra-foundation-postgres:
    name: QRA Foundation source methodology and model (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Validate QRA Foundation architecture boundaries
        run: python scripts/validate_qra_foundation_guardrails.py
      - name: Run PostgreSQL acceptance and reversible migration
        shell: bash
        run: |
          set -o pipefail
          mkdir -p outputs/.qa/qra-foundation
          docker compose -p pypmis-qra-ci -f docker-compose.qra-foundation.yml up \
            --build --abort-on-container-exit --exit-code-from qra-validation \
            qra-validation 2>&1 | tee outputs/.qa/qra-foundation/postgres-validation.log
      - name: Destroy isolated QRA acceptance environment
        if: always()
        run: docker compose -p pypmis-qra-ci -f docker-compose.qra-foundation.yml down --remove-orphans
      - name: Preserve QRA PostgreSQL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qra-foundation-postgres-validation
          path: outputs/.qa/qra-foundation/postgres-validation.log
          if-no-files-found: error

  qra-foundation-browser:
    name: QRA Foundation USER and ADMIN real Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [qra-foundation-postgres, backend-lint, frontend-lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npx playwright install --with-deps chromium
      - name: Start isolated QRA API and frontend
        run: |
          docker compose -p pypmis-qra-browser-ci -f docker-compose.qra-foundation.yml \
            --profile browser up -d --build qra-browser-frontend
          timeout 300 bash -c 'until curl --max-time 10 -sf http://127.0.0.1:8816/api/v1/health/ready >/dev/null; do sleep 2; done'
          timeout 300 bash -c 'until curl --max-time 10 -sf http://127.0.0.1:5519 >/dev/null; do sleep 2; done'
      - name: Validate governed USER and ADMIN lifecycles
        env:
          E2E_BASE_URL: http://127.0.0.1:5519
          E2E_API_URL: http://127.0.0.1:8816
        run: cd frontend && npx playwright test qra-foundation.spec.ts --project=chromium --workers=1
      - name: Preserve QRA browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qra-foundation-browser-evidence
          path: frontend/test-results/
          if-no-files-found: ignore
      - name: Destroy isolated QRA browser environment
        if: always()
        run: docker compose -p pypmis-qra-browser-ci -f docker-compose.qra-foundation.yml --profile browser down --remove-orphans

  wave3b-owner-capability-postgres:
    name: Wave 3B Owner Capability Readiness (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Validate Wave 3B authority and migration boundaries
