      - name: Destroy ephemeral Wave 3B validation environment
        if: always()
        run: docker compose -p pypmis-wave3b-ci -f docker-compose.wave3b.yml down --remove-orphans
      - name: Preserve Wave 3B PostgreSQL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave3b-postgres-validation
          path: outputs/.qa/wave3b-owner-capability/postgres-validation.log
