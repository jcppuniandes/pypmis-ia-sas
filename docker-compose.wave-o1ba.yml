name: pypmis-wave-o1ba

# Dedicated disposable validation stack; never shares normal or O1A databases.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: o1ba
      POSTGRES_USER: o1ba
      POSTGRES_PASSWORD: disposable-o1ba
    volumes: [o1ba_postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U o1ba -d o1ba]
      interval: 2s
      timeout: 3s
      retries: 30
  migration-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: o1ba_migration
      POSTGRES_USER: o1ba
      POSTGRES_PASSWORD: disposable-o1ba
    volumes: [o1ba_migration_postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U o1ba -d o1ba_migration]
      interval: 2s
      timeout: 3s
      retries: 30
  regression-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: o1ba_regression
      POSTGRES_USER: o1ba
      POSTGRES_PASSWORD: disposable-o1ba
    volumes: [o1ba_regression_postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U o1ba -d o1ba_regression]
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    image: pypmis-ia-sas-api:latest
    build: {context: ./backend}
    environment:
      DATABASE_URL: postgresql+psycopg://o1ba:disposable-o1ba@db:5432/o1ba
      PYPMIS_TEST_DATABASE_URL: postgresql+psycopg://o1ba:disposable-o1ba@db:5432/o1ba
      PYPMIS_O1BA_MIGRATION_DATABASE_URL: postgresql+psycopg://o1ba:disposable-o1ba@migration-db:5432/o1ba_migration
      PYPMIS_O1BA_FIXTURE: disposable-only
      PYTHONDONTWRITEBYTECODE: "1"
      PYPMIS_PYTEST_RUNTIME_DIR: /tmp/o1ba-pytest
      PYPMIS_PYTEST_BASETEMP: /tmp/o1ba-tests
      AUTO_CREATE_SCHEMA: "false"
      SEED_DEMO_DATA: "false"
      AUTH_SECRET_KEY: isolated-o1ba-validation-only
      RATE_LIMIT_ENABLED: "false"
      CORS_ORIGINS: http://127.0.0.1:5512,http://localhost:5512
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      REDIS_URL: redis://redis:6379/0
      DOCUMENT_STORAGE_PATH: /var/lib/o1ba-documents
    volumes:
      - ./backend:/app:ro
      - ./outputs/.qa/wave-o1ba-20261020:/artifacts
      - o1ba_documents:/var/lib/o1ba-documents
    ports: ["127.0.0.1:8852:8000"]
    command: [python, -m, uvicorn, app.main:app, --host, 0.0.0.0, --port, "8000"]
    depends_on:
      db: {condition: service_healthy}
      migration-db: {condition: service_healthy}
      regression-db: {condition: service_healthy}
      redis: {condition: service_healthy}
  redis:
    image: redis:7-alpine
    command: [redis-server, --save, "", --appendonly, "no"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30
  frontend:
    image: pypmis-ia-sas-frontend:latest
    build: {context: ./frontend}
    environment:
      VITE_API_URL: http://127.0.0.1:8852
      VITE_DEV_PROXY_TARGET: http://api:8000
      VITE_FRONTEND_VALIDATION_MODE: "false"
    volumes:
      - ./frontend:/app:ro
      - /app/node_modules
    ports: ["127.0.0.1:5512:5173"]
    command:
      - /bin/sh
      - -ec
      - |
        node node_modules/vite/bin/vite.js build --outDir /tmp/o1ba-dist
        npm run preview -- --host 0.0.0.0 --port 5173 --strictPort --outDir /tmp/o1ba-dist
    depends_on: [api]

volumes:
  o1ba_postgres:
  o1ba_migration_postgres:
  o1ba_regression_postgres:
  o1ba_documents:
