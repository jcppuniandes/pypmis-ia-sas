name: pypmis-wave2b

services:
  wave2b-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wave2b
      POSTGRES_USER: wave2b
      POSTGRES_PASSWORD: wave2b
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U wave2b -d wave2b]
      interval: 2s
      timeout: 3s
      retries: 30

  wave2b-migration-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wave2b_migration
      POSTGRES_USER: wave2b
      POSTGRES_PASSWORD: wave2b
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U wave2b -d wave2b_migration]
      interval: 2s
      timeout: 3s
      retries: 30

  wave2b-validation:
    build: {context: ./backend}
    environment:
      DATABASE_URL: postgresql+psycopg://wave2b:wave2b@wave2b-db:5432/wave2b
      PYPMIS_TEST_DATABASE_URL: postgresql+psycopg://wave2b:wave2b@wave2b-db:5432/wave2b
      PYPMIS_WAVE2B_MIGRATION_DATABASE_URL: postgresql+psycopg://wave2b:wave2b@wave2b-migration-db:5432/wave2b_migration
      AUTO_CREATE_SCHEMA: "false"
      SEED_DEMO_DATA: "true"
      AUTH_SECRET_KEY: wave2b-disposable-only
      DEMO_USER_PASSWORD: "1234"
      RATE_LIMIT_ENABLED: "false"
    command:
      - /bin/sh
      - -ec
      - |
        python -c 'from app.database.session import Base, engine; import app.main; Base.metadata.create_all(engine)'
        alembic stamp head
        python -c 'from app.database.seed import seed_demo; from app.database.session import SessionLocal; db=SessionLocal(); seed_demo(db); db.close()'
        pytest -o addopts= --no-cov -q -rA tests/postgres/test_wave2b_migration_postgres.py
        pytest -o addopts= --no-cov -q -rA tests/postgres/test_wave2b_risk_basic_data_postgres.py
    depends_on:
      wave2b-db: {condition: service_healthy}
      wave2b-migration-db: {condition: service_healthy}

  wave2b-browser-db:
    image: postgres:16-alpine
    profiles: [browser]
    environment:
      POSTGRES_DB: wave2b_browser
      POSTGRES_USER: wave2b
      POSTGRES_PASSWORD: wave2b
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U wave2b -d wave2b_browser]
      interval: 2s
      timeout: 3s
      retries: 30

  wave2b-browser-api:
    build: {context: ./backend}
    profiles: [browser]
    environment:
      DATABASE_URL: postgresql+psycopg://wave2b:wave2b@wave2b-browser-db:5432/wave2b_browser
      REDIS_URL: redis://wave2b-browser-redis:6379/0
      PYPMIS_WAVE2B_BROWSER_FIXTURE: disposable-only
      AUTO_CREATE_SCHEMA: "false"
      SEED_DEMO_DATA: "false"
      AUTH_SECRET_KEY: wave2b-disposable-only
      DEMO_USER_PASSWORD: "1234"
      RATE_LIMIT_ENABLED: "false"
      CORS_ORIGINS: http://127.0.0.1:5517,http://localhost:5517
      ALLOWED_HOSTS: localhost,127.0.0.1
    ports: ["127.0.0.1:8814:8000"]
    command:
      - /bin/sh
      - -ec
      - |
        python -m tests.provision_wave2b_browser
        alembic stamp head
        python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      wave2b-browser-db: {condition: service_healthy}
      wave2b-browser-redis: {condition: service_healthy}

  wave2b-browser-redis:
    image: redis:7-alpine
    profiles: [browser]
    command: [redis-server, --save, "", --appendonly, "no"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30

  wave2b-browser-frontend:
    build: {context: ./frontend}
    profiles: [browser]
    environment:
      VITE_API_URL: http://127.0.0.1:8814
      VITE_FRONTEND_VALIDATION_MODE: "false"
    command:
      - /bin/sh
      - -ec
      - |
        npm run build -- --outDir /tmp/wave2b-browser-dist
        npm run preview -- --host 0.0.0.0 --port 5173 --strictPort --outDir /tmp/wave2b-browser-dist
    ports: ["127.0.0.1:5517:5173"]
    volumes: ["./frontend:/app:ro", /app/node_modules]
    depends_on: [wave2b-browser-api]
