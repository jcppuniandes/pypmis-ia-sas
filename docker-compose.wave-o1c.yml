name: pypmis-wave-o1c

# Disposable O1C validation. No normal application data volumes are mounted.
services:
  db:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: o1c, POSTGRES_USER: o1c, POSTGRES_PASSWORD: disposable-o1c}
    volumes: [o1c_postgres:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5550:5432"]
    healthcheck: {test: [CMD-SHELL, pg_isready -U o1c -d o1c], interval: 2s, timeout: 3s, retries: 30}
  migration-db:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: o1c_migration, POSTGRES_USER: o1c, POSTGRES_PASSWORD: disposable-o1c}
    volumes: [o1c_migration_postgres:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5551:5432"]
    healthcheck: {test: [CMD-SHELL, pg_isready -U o1c -d o1c_migration], interval: 2s, timeout: 3s, retries: 30}
  browser-db:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: o1c_browser, POSTGRES_USER: o1c, POSTGRES_PASSWORD: disposable-o1c}
    volumes: [o1c_browser_postgres:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, pg_isready -U o1c -d o1c_browser], interval: 2s, timeout: 3s, retries: 30}
  redis:
    image: redis:7-alpine
    command: [redis-server, --save, "", --appendonly, "no"]
    healthcheck: {test: [CMD, redis-cli, ping], interval: 2s, timeout: 3s, retries: 30}
  api:
    image: pypmis-ia-sas-api:latest
    build: {context: ./backend}
    environment:
      DATABASE_URL: postgresql+psycopg://o1c:disposable-o1c@browser-db:5432/o1c_browser
      PYPMIS_TEST_DATABASE_URL: postgresql+psycopg://o1c:disposable-o1c@db:5432/o1c
      PYPMIS_O1C_MIGRATION_DATABASE_URL: postgresql+psycopg://o1c:disposable-o1c@migration-db:5432/o1c_migration
      PYPMIS_O1C_FIXTURE: disposable-only
      PYTHONDONTWRITEBYTECODE: ""
      PYTHONPYCACHEPREFIX: /var/cache/o1c-python
      PYPMIS_PYTEST_RUNTIME_DIR: /tmp/o1c-pytest
      PYPMIS_PYTEST_BASETEMP: /tmp/o1c-tests
      AUTO_CREATE_SCHEMA: "false"
      SEED_DEMO_DATA: "false"
      AUTH_SECRET_KEY: isolated-o1c-validation-only
      RATE_LIMIT_ENABLED: "false"
      CORS_ORIGINS: http://127.0.0.1:5518,http://localhost:5518
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      REDIS_URL: redis://redis:6379/0
      DOCUMENT_STORAGE_PATH: /var/lib/o1c-documents
    volumes:
      - ./backend:/app:ro
      - ./outputs/.qa/wave-o1c-20261106:/artifacts
      - o1c_documents:/var/lib/o1c-documents
      - o1c_python_cache:/var/cache/o1c-python
    ports: ["127.0.0.1:8858:8000"]
    command: [python, -m, uvicorn, app.main:app, --host, 0.0.0.0, --port, "8000"]
    depends_on:
      browser-db: {condition: service_healthy}
      redis: {condition: service_healthy}
  frontend:
    image: pypmis-ia-sas-frontend:latest
    build: {context: ./frontend}
    environment:
      VITE_API_URL: http://127.0.0.1:8858
      VITE_DEV_PROXY_TARGET: http://api:8000
      VITE_FRONTEND_VALIDATION_MODE: "false"
    volumes: ["./frontend:/app:ro", "/app/node_modules"]
    ports: ["127.0.0.1:5518:5173"]
    command:
      - /bin/sh
      - -ec
      - |
        node node_modules/vite/bin/vite.js build --outDir /tmp/o1c-dist
        npm run preview -- --host 0.0.0.0 --port 5173 --strictPort --outDir /tmp/o1c-dist
    depends_on: [api]
volumes:
  o1c_postgres:
  o1c_migration_postgres:
  o1c_browser_postgres:
  o1c_documents:
  o1c_python_cache:
