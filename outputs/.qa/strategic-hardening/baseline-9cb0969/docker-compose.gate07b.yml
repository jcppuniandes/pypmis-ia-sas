services:
  gate07b-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gate07b
      POSTGRES_USER: gate07b
      POSTGRES_PASSWORD: gate07b
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gate07b -d gate07b"]
      interval: 2s
      timeout: 3s
      retries: 30

  gate07b-test:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://gate07b:gate07b@gate07b-db:5432/gate07b
      PYPMIS_TEST_DATABASE_URL: postgresql+psycopg://gate07b:gate07b@gate07b-db:5432/gate07b
      AUTO_CREATE_SCHEMA: "true"
      SEED_DEMO_DATA: "true"
      AUTH_SECRET_KEY: gate07b-disposable-only
      RATE_LIMIT_ENABLED: "false"
    command:
      - /bin/sh
      - -ec
      - |
        python -c "from sqlalchemy import text; from app.database.session import Base, engine; import app.domain.models, app.modules.enterprise_structure.models, app.modules.project_creation.models, app.modules.project_workspace_initialization.models, app.modules.physical_workspace_creation.models, app.modules.physical_workspace_initialization.models, app.modules.workspace_context.models, app.modules.idea_demand.models, app.modules.project_proposal.models; Base.metadata.create_all(engine); connection = engine.connect(); connection.execute(text('DROP TABLE project_proposal_evaluations')); connection.execute(text('DROP TABLE project_proposals')); connection.commit(); connection.close()"
        alembic stamp 20260813_0040
        alembic upgrade head
        pytest --no-cov -q tests/test_project_proposal_gate07b.py tests/test_idea_demand_gate07a.py
        alembic downgrade 20260813_0040
        alembic upgrade head
    depends_on:
      gate07b-db:
        condition: service_healthy
