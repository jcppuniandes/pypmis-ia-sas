services:
  gate06d-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gate06d
      POSTGRES_USER: gate06d
      POSTGRES_PASSWORD: gate06d
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gate06d -d gate06d"]
      interval: 2s
      timeout: 3s
      retries: 30

  gate06d-test:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://gate06d:gate06d@gate06d-db:5432/gate06d
      PYPMIS_TEST_DATABASE_URL: postgresql+psycopg://gate06d:gate06d@gate06d-db:5432/gate06d
      AUTO_CREATE_SCHEMA: "true"
      SEED_DEMO_DATA: "true"
      AUTH_SECRET_KEY: gate06d-disposable-only
      RATE_LIMIT_ENABLED: "false"
    command:
      - /bin/sh
      - -ec
      - |
        python -c "from sqlalchemy import text; from app.database.session import Base, engine; import app.domain.models, app.modules.enterprise_structure.models, app.modules.project_creation.models, app.modules.project_workspace_initialization.models, app.modules.physical_workspace_creation.models, app.modules.physical_workspace_initialization.models, app.modules.workspace_context.models; Base.metadata.create_all(engine); connection = engine.connect(); connection.execute(text('DROP TABLE recent_workspaces')); connection.commit(); connection.close()"
        alembic stamp 20260813_0038
        alembic upgrade head
        pytest --no-cov -q tests/test_workspace_context.py
        alembic downgrade 20260813_0038
        alembic upgrade head
    depends_on:
      gate06d-db:
        condition: service_healthy
