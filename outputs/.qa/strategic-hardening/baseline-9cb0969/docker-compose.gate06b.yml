services:
  gate06b-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gate06b
      POSTGRES_USER: gate06b
      POSTGRES_PASSWORD: gate06b
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gate06b -d gate06b"]
      interval: 2s
      timeout: 3s
      retries: 30

  gate06b-test:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://gate06b:gate06b@gate06b-db:5432/gate06b
      PYPMIS_TEST_DATABASE_URL: postgresql+psycopg://gate06b:gate06b@gate06b-db:5432/gate06b
      AUTO_CREATE_SCHEMA: "true"
      SEED_DEMO_DATA: "true"
      AUTH_SECRET_KEY: gate06b-disposable-only
      RATE_LIMIT_ENABLED: "false"
    command:
      - /bin/sh
      - -ec
      - |
        python -c "from sqlalchemy import text; from app.database.session import Base, engine; import app.domain.models, app.modules.enterprise_structure.models, app.modules.project_creation.models, app.modules.project_workspace_initialization.models, app.modules.physical_workspace_creation.models; Base.metadata.create_all(engine); connection = engine.connect(); connection.execute(text('DROP TABLE physical_workspace_creation_requests')); connection.commit(); connection.close()"
        alembic stamp 20260812_0036
        alembic upgrade head
        pytest --no-cov -q tests/test_physical_workspace_creation.py
        alembic downgrade 20260812_0036
        alembic upgrade head
    depends_on:
      gate06b-db:
        condition: service_healthy
