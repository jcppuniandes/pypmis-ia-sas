name: pypmis-qra-evidence

# Contextual QRA evidence validation only. Disposable databases use tmpfs;
# operational databases, volumes, Redis and ports are never shared.
services:
  evidence-db:
    image: postgres:16-alpine
    environment:
      { POSTGRES_DB: qra_evidence, POSTGRES_USER: qra, POSTGRES_PASSWORD: qra }
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U qra -d qra_evidence]
      interval: 2s
      timeout: 3s
      retries: 30
  evidence-validation:
    image: pypmis-qra-engine-qra-validation:latest
    build: { context: ./backend }
    environment:
      DATABASE_URL: postgresql+psycopg://qra:qra@evidence-db:5432/qra_evidence
      PYPMIS_TEST_DATABASE_URL: postgresql+psycopg://qra:qra@evidence-db:5432/qra_evidence
      AUTO_CREATE_SCHEMA: "false"
      SEED_DEMO_DATA: "true"
      AUTH_SECRET_KEY: qra-evidence-disposable-only
      DEMO_USER_PASSWORD: "1234"
      RATE_LIMIT_ENABLED: "false"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYPMIS_PYTEST_RUNTIME_DIR: /tmp/qra-evidence-tests
      PYPMIS_PYTEST_BASETEMP: /tmp/qra-evidence-tests
      QRA_EVIDENCE_STACK_ARTIFACT: /artifacts/actual-stack-ci.json
    volumes: [./backend:/app:ro, ./outputs/.qa/qra-evidence:/artifacts]
    command:
      [
        pytest,
        -p,
        "no:cacheprovider",
        -o,
        "addopts=",
        --no-cov,
        -q,
        -rA,
        tests/test_qra_evidence_policy.py,
        tests/test_qra_evidence_policy_persistence.py,
        tests/test_qra_evidence_business_case.py,
        tests/test_business_case_gate07m_bc_5c.py,
        tests/test_gate07j_evid2_decision_criteria.py,
        tests/test_qra_evidence_stack.py,
        --basetemp=/tmp/qra-evidence-pytest,
        --junitxml=/artifacts/backend-postgres-final.xml,
      ]
    depends_on:
      evidence-db: { condition: service_healthy }
  evidence-browser-db:
    image: postgres:16-alpine
    profiles: [browser]
    environment:
      {
        POSTGRES_DB: qra_evidence_browser,
        POSTGRES_USER: qra,
        POSTGRES_PASSWORD: qra,
      }
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U qra -d qra_evidence_browser]
      interval: 2s
      timeout: 3s
      retries: 30
  evidence-browser-redis:
    image: redis:7-alpine
    profiles: [browser]
    command: [redis-server, --save, "", --appendonly, "no"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30
  evidence-browser-api:
    image: pypmis-qra-engine-qra-validation:latest
    build: { context: ./backend }
    profiles: [browser]
    environment:
      DATABASE_URL: postgresql+psycopg://qra:qra@evidence-browser-db:5432/qra_evidence_browser
      REDIS_URL: redis://evidence-browser-redis:6379/0
      PYPMIS_QRA_EVIDENCE_BROWSER_FIXTURE: disposable-only
      AUTO_CREATE_SCHEMA: "false"
      SEED_DEMO_DATA: "false"
      AUTH_SECRET_KEY: qra-evidence-disposable-only
      DEMO_USER_PASSWORD: "1234"
      RATE_LIMIT_ENABLED: "false"
      CORS_ORIGINS: http://127.0.0.1:5533,http://localhost:5533
      ALLOWED_HOSTS: localhost,127.0.0.1
      OPENBLAS_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    volumes: [./backend:/app:ro]
    ports: ["127.0.0.1:8830:8000"]
    command:
      [
        /bin/sh,
        -ec,
        "python -m tests.provision_qra_evidence_browser; python -m uvicorn app.main:app --host 0.0.0.0 --port 8000",
      ]
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=2)",
        ]
      start_period: 180s
      interval: 5s
      timeout: 4s
      retries: 60
    depends_on:
      evidence-browser-db: { condition: service_healthy }
      evidence-browser-redis: { condition: service_healthy }
  evidence-browser-frontend:
    image: pypmis-ia-sas-frontend:latest
    build: { context: ./frontend }
    profiles: [browser]
    environment:
      VITE_API_URL: http://127.0.0.1:8830
      VITE_FRONTEND_VALIDATION_MODE: "false"
    command:
      [
        /bin/sh,
        -ec,
        "npm run build -- --outDir /tmp/qra-evidence-browser-dist; npm run preview -- --host 0.0.0.0 --port 5173 --strictPort --outDir /tmp/qra-evidence-browser-dist",
      ]
    ports: ["127.0.0.1:5533:5173"]
    volumes: [./frontend:/app:ro, /app/node_modules]
    depends_on: [evidence-browser-api]
