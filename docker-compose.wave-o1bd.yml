name: pypmis-wave-o1bd

# Disposable validation only; never mounts the normal application volumes.
services:
  db:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: o1bd, POSTGRES_USER: o1bd, POSTGRES_PASSWORD: disposable-o1bd}
    volumes: [o1bd_postgres:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5548:5432"]
    healthcheck: {test: [CMD-SHELL, pg_isready -U o1bd -d o1bd], interval: 2s, timeout: 3s, retries: 30}
  migration-db:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: o1bd_migration, POSTGRES_USER: o1bd, POSTGRES_PASSWORD: disposable-o1bd}
    volumes: [o1bd_migration_postgres:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5549:5432"]
    healthcheck: {test: [CMD-SHELL, pg_isready -U o1bd -d o1bd_migration], interval: 2s, timeout: 3s, retries: 30}
  browser-db:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: o1bd_browser, POSTGRES_USER: o1bd, POSTGRES_PASSWORD: disposable-o1bd}
    volumes: [o1bd_browser_postgres:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, pg_isready -U o1bd -d o1bd_browser], interval: 2s, timeout: 3s, retries: 30}
  redis:
    image: redis:7-alpine
    command: [redis-server, --save, "", --appendonly, "no"]
    healthcheck: {test: [CMD, redis-cli, ping], interval: 2s, timeout: 3s, retries: 30}
  api:
    image: pypmis-ia-sas-api:latest
    build: {context: ./backend}
    environment:
      DATABASE_URL: postgresql+psycopg://o1bd:disposable-o1bd@browser-db:5432/o1bd_browser
      PYPMIS_TEST_DATABASE_URL: postgresql+psycopg://o1bd:disposable-o1bd@db:5432/o1bd
      PYPMIS_O1BD_MIGRATION_DATABASE_URL: postgresql+psycopg://o1bd:disposable-o1bd@migration-db:5432/o1bd_migration
      PYPMIS_O1BD_FIXTURE: disposable-only
      # Cache only in the isolated Linux volume, never in the Windows source tree.
      PYTHONDONTWRITEBYTECODE: ""
      PYTHONPYCACHEPREFIX: /var/cache/o1bd-python
      PYPMIS_PYTEST_RUNTIME_DIR: /tmp/o1bd-pytest
      PYPMIS_PYTEST_BASETEMP: /tmp/o1bd-tests
      AUTO_CREATE_SCHEMA: "false"
      SEED_DEMO_DATA: "false"
      AUTH_SECRET_KEY: isolated-o1bd-validation-only
      RATE_LIMIT_ENABLED: "false"
      CORS_ORIGINS: http://127.0.0.1:5517,http://localhost:5517
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      REDIS_URL: redis://redis:6379/0
      DOCUMENT_STORAGE_PATH: /var/lib/o1bd-documents
    volumes:
      - ./backend:/app:ro
      - ./outputs/.qa/wave-o1bd-20261104:/artifacts
      - o1bd_documents:/var/lib/o1bd-documents
      - o1bd_python_cache:/var/cache/o1bd-python
    ports: ["127.0.0.1:8857:8000"]
    command: [python, -m, uvicorn, app.main:app, --host, 0.0.0.0, --port, "8000"]
    depends_on:
      db: {condition: service_healthy}
      migration-db: {condition: service_healthy}
      browser-db: {condition: service_healthy}
      redis: {condition: service_healthy}
  frontend:
    image: pypmis-ia-sas-frontend:latest
    build: {context: ./frontend}
    environment:
      VITE_API_URL: http://127.0.0.1:8857
      VITE_DEV_PROXY_TARGET: http://api:8000
      VITE_FRONTEND_VALIDATION_MODE: "false"
    volumes: ["./frontend:/app:ro", "/app/node_modules"]
    ports: ["127.0.0.1:5517:5173"]
    command:
      - /bin/sh
      - -ec
      - |
        node node_modules/vite/bin/vite.js build --outDir /tmp/o1bd-dist
        npm run preview -- --host 0.0.0.0 --port 5173 --strictPort --outDir /tmp/o1bd-dist
    depends_on: [api]
volumes:
  o1bd_postgres:
  o1bd_migration_postgres:
  o1bd_browser_postgres:
  o1bd_documents:
  o1bd_python_cache:
